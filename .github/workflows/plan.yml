name: Write new posts

on:
  schedule:
    - cron: "0 4 * * *"  # every day 04:00 UTC: top the queue up to queue_target
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts (leave empty to fill up to queue_target)"
        required: false
        default: ""
      preview:
        description: "Also save the card images next to the posts so you can review them"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y --no-install-recommends libfribidi0 >/dev/null 2>&1 || true
          pip install -q -r requirements.txt

      - name: ANTHROPIC_API_KEY missing
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::ANTHROPIC_API_KEY is not set, so no posts were written. Add it as a secret, or fill content/queue another way (see README)."

      - name: Generate posts with Claude
        if: env.ANTHROPIC_API_KEY != ''
        env:
          COUNT: ${{ inputs.count }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          ARGS=()
          if [[ "$COUNT" =~ ^[0-9]+$ ]]; then ARGS+=(--count "$COUNT"); fi
          if [ "$PREVIEW" = "true" ]; then ARGS+=(--preview); fi
          python -m fbposter plan "${ARGS[@]}"

      - name: Save queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Queue new posts"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
