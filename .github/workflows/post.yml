name: Publish post

on:
  schedule:
    # GitHub cron times are UTC. Cairo is UTC+2 in winter and UTC+3 in summer.
    # 4 posts a day: 09:00, 13:00, 18:00, 22:00 Cairo in winter (one hour later in summer).
    # Add or remove hours here to change how many posts go out per day.
    - cron: "0 7,11,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show the post without publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y --no-install-recommends libfribidi0 >/dev/null 2>&1 || true
          pip install -q -r requirements.txt

      - name: Publish next post
        if: env.FB_PAGE_ID != '' && env.FB_PAGE_ACCESS_TOKEN != ''
        run: python -m fbposter post ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Facebook secrets missing
        if: env.FB_PAGE_ID == '' || env.FB_PAGE_ACCESS_TOKEN == ''
        run: echo "::warning::Add FB_PAGE_ID and FB_PAGE_ACCESS_TOKEN in Settings > Secrets and variables > Actions (see README)."

      - name: Save history
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Publish post"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
