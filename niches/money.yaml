# فلوسك: إدارة مالية شخصية للمصريين
title: "فلوسك"
audience: >
  شباب وموظفين وأسر في مصر، من 20 لـ 45 سنة، دخلهم متوسط، وعايزين يفهموا يصرفوا
  ويحوّشوا ويخططوا إزاي في ظل الغلا. مش خبراء مال.
voice: >
  واقعي وهادي ومتعاطف. مفيش وعود بثراء سريع ولا لوم للناس. أرقام بسيطة وأمثلة من الحياة
  اليومية (المرتب، الجمعية، المصاريف الشهرية، المدارس).
language: "Egyptian Arabic (عامية مصرية)"
image_ratio: 0.7

pillars:
  - id: money_rule
    name: "قاعدة فلوس"
    description: "قاعدة مالية واحدة بسيطة (زي ادفع لنفسك الأول أو صندوق الطوارئ) مع مثال بأرقام تقريبية."
    weight: 3
  - id: save_tip
    name: "وفّر في"
    description: "طريقة عملية للتوفير في بند معين (أكل، مواصلات، فواتير، هدايا) من غير ما الحياة تبقى صعبة."
    weight: 3
  - id: money_myth
    name: "خرافة ولا حقيقة؟"
    description: "اعتقاد شائع غلط عن الفلوس والادخار، وبعده التصحيح بهدوء."
    weight: 2
  - id: explain_term
    name: "يعني إيه؟"
    description: "شرح مصطلح مالي (تضخم، فايدة مركبة، تنويع، ميزانية) بتشبيه بسيط."
    weight: 2
  - id: community_question
    name: "سؤال للمتابعين"
    description: "سؤال يفتح نقاش عن تجارب الناس مع الفلوس والتوفير."
    weight: 1
    image: false

hashtags: ["#فلوسك", "#ادخار", "#إدارة_مالية", "#توفير", "#نصايح_مالية"]

rules:
  - "ممنوع ترشّح أسهم أو عملات رقمية أو استثمار معين، وممنوع توعد بأرباح."
  - "ماتذكرش أسعار فايدة أو أسعار صرف أو أسعار سلع حالية لأنها بتتغير. استخدم أرقام توضيحية وقول إنها مثال."
  - "في المواضيع الكبيرة (قروض، استثمار) انصح الناس يستشيروا متخصص."
