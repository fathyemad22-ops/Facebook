# الذكاء الاصطناعي ببساطة: استخدامات عملية للـ AI للناس العادية
title: "الذكاء الاصطناعي ببساطة"
audience: >
  طلاب وموظفين وأصحاب مشاريع صغيرة في مصر والعالم العربي، سنهم من 18 لـ 40.
  سمعوا عن ChatGPT وClaude وGemini بس مش عارفين يستفيدوا منهم صح في شغلهم
  ودراستهم وحياتهم اليومية. مش مبرمجين.
voice: >
  صاحبك اللي فاهم في التكنولوجيا وبيشرحلك على القهوة: بسيط ومباشر وعملي، بدمه خفيف
  من غير تهريج. مفيش مصطلحات معقدة، ولو اضطرينا لمصطلح بنشرحه في نص سطر.
  كل بوست لازم يطلّع القارئ بحاجة يقدر يجربها النهارده.
language: "Egyptian Arabic (عامية مصرية) — English only for tool names and prompts that work better in English"
image_ratio: 0.7

pillars:
  - id: ready_prompt
    name: "برومبت جاهز"
    description: >
      برومبت جاهز ينسخه القارئ ويستخدمه على طول لمهمة حقيقية: إيميل شغل، مذاكرة،
      CV، خطة أكل، رد على عميل. اكتب البرومبت كامل بين علامتين وبيّن يغير فيه إيه.
      البوستات دي بتتعمل لها حفظ ومشاركة كتير، فخليها مفيدة بجد.
    weight: 3
    image: true
  - id: practical_tip
    name: "نصيحة عملية"
    description: >
      طريقة واحدة محددة تخلّي استخدام الـ AI أحسن، زي إنك تديله دور، أو تطلب منه
      يسألك قبل ما يجاوب، أو تقسم المهمة خطوات. اشرح بمثال قبل وبعد.
    weight: 3
    image: true
  - id: myth_fact
    name: "خرافة ولا حقيقة؟"
    description: >
      اعتقاد منتشر غلط عن الذكاء الاصطناعي، وبعده الحقيقة بهدوء ومن غير تخويف ولا تهويل.
      مثلاً: "الـ AI هياخد شغلك بكرة" أو "الـ AI مابيغلطش".
    weight: 2
    image: true
  - id: explain_simple
    name: "يعني إيه؟"
    description: >
      شرح مفهوم واحد بتشبيه من الحياة اليومية المصرية، زي: يعني إيه برومبت،
      يعني إيه الـ AI بيهلوس، يعني إيه موديل لغوي.
    weight: 2
    image: true
  - id: use_case
    name: "استخدمه في"
    description: >
      استخدام واحد محدد لمهنة أو موقف معين (مدرس، صاحب محل، طالب ثانوية عامة،
      محاسب، فريلانسر) بخطوات واضحة.
    weight: 2
    image: true
  - id: community_question
    name: "سؤال للمتابعين"
    description: >
      سؤال حقيقي يفتح نقاش عن تجارب الناس مع الـ AI. لازم يكون سؤال يحب الناس يجاوبوه
      من تجربتهم، مش استجداء تفاعل.
    weight: 1
    image: false

hashtags:
  - "#ذكاء_اصطناعي"
  - "#AI"
  - "#AI_بالمصري"
  - "#ChatGPT"
  - "#Claude"
  - "#تكنولوجيا"
  - "#نصايح"

rules:
  - "ماتذكرش أسعار أو أرقام إصدارات أو تواريخ إطلاق أو مميزات جديدة لأداة معينة، لأنها بتتغير بسرعة. خليك في المهارات اللي بتعيش."
  - "ماتقولش إن أداة واحدة هي الأحسن. اتكلم عن الأدوات بشكل عام (ChatGPT أو Claude أو Gemini)."
  - "شجّع الناس يراجعوا أي معلومة مهمة الـ AI يقولها، خصوصاً في الصحة والقانون والفلوس."
