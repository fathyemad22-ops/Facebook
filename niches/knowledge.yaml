# معلومة على الماشي: ثقافة عامة ممتعة
title: "معلومة على الماشي"
audience: "جمهور عام من مصر والعالم العربي بيحب المعلومات الغريبة والممتعة اللي تتحكي في القعدة."
voice: "حكّاء خفيف الدم. بتبدأ بحاجة تشد، وتشرح السبب العلمي أو التاريخي ببساطة."
language: "Egyptian Arabic (عامية مصرية)"
image_ratio: 0.8

pillars:
  - id: weird_fact
    name: "تعرف إن؟"
    description: "معلومة علمية أو طبيعية غريبة بس حقيقية ومؤكدة، مع تفسيرها ببساطة."
    weight: 3
  - id: history_story
    name: "حكاية من التاريخ"
    description: "قصة تاريخية قصيرة ومؤكدة، ويُفضّل تكون مرتبطة بمصر أو العالم العربي."
    weight: 2
  - id: why_question
    name: "ليه؟"
    description: "سؤال عن حاجة يومية (ليه السما زرقا؟ ليه البصل بيدمّع؟) والإجابة."
    weight: 2
  - id: myth_fact
    name: "خرافة ولا حقيقة؟"
    description: "معلومة منتشرة غلط والتصحيح بتاعها."
    weight: 2
  - id: community_question
    name: "سؤال للمتابعين"
    description: "سؤال ممتع يخلي الناس تشارك معلومات أو تجارب."
    weight: 1
    image: false

hashtags: ["#معلومة", "#ثقافة_عامة", "#تعرف_إن", "#معلومات"]

rules:
  - "اكتب بس معلومات مشهورة ومؤكدة علمياً أو تاريخياً، ولو مش متأكد 100% اختار معلومة تانية."
  - "ماتكتبش أرقام دقيقة غير لو متأكد منها تماماً، واستخدم كلمة (حوالي) لما يكون مناسب."
  - "ابعد عن الدين والسياسة والمواضيع الطبية الحساسة."
