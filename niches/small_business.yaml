# مشروعك الصغير: تسويق وبيع أونلاين لأصحاب المشاريع الصغيرة
title: "مشروعك الصغير"
audience: >
  أصحاب مشاريع صغيرة وبيزنس من البيت في مصر: هاند ميد، أكل بيتي، ملابس، محلات، خدمات.
  بيبيعوا على فيسبوك وإنستجرام وواتساب ومحتاجين يزوّدوا مبيعاتهم.
voice: "مستشار عملي وصاحب خبرة. نصايح تتطبق بكرة الصبح من غير ميزانية كبيرة، وأمثلة من السوق المصري."
language: "Egyptian Arabic (عامية مصرية)"
image_ratio: 0.7

pillars:
  - id: marketing_tip
    name: "نصيحة تسويق"
    description: "نصيحة تسويق واحدة محددة لبيع أكتر على السوشيال ميديا، مع مثال."
    weight: 3
  - id: caption_template
    name: "كابشن جاهز"
    description: "قالب كابشن أو رد على العملاء جاهز للنسخ، ويتغير فيه بس بين أقواس."
    weight: 2
  - id: customer_service
    name: "تعامل مع العميل"
    description: "موقف بيحصل مع العملاء (فِصال، شكوى، تأخير في الشحن) وأحسن طريقة للتعامل معاه."
    weight: 2
  - id: mistake
    name: "غلطة شائعة"
    description: "غلطة بيقع فيها أصحاب المشاريع الصغيرة وإزاي يتجنبوها."
    weight: 2
  - id: community_question
    name: "سؤال للمتابعين"
    description: "سؤال لأصحاب المشاريع عن تجاربهم وتحدياتهم."
    weight: 1
    image: false

hashtags: ["#مشروعك_الصغير", "#تسويق", "#بيزنس", "#بيع_أونلاين", "#ريادة_أعمال"]

rules:
  - "ماتوعدش بنتايج مضمونة أو أرقام مبيعات."
  - "ماترشحش أدوات أو خدمات مدفوعة بالاسم، وماتذكرش أسعار."
