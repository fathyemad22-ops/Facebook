# =====================================================================
#  الإعدادات الرئيسية للسيستم. عدّلوا هنا وكل حاجة هتمشي على كده
# =====================================================================

page:
  # اسم الصفحة زي ما بيظهر في أسفل صور البوستات
  name: "AI بالمصري"
  # يوزرنيم الصفحة أو أي نص قصير يظهر جنب الاسم، وممكن تسيبوه فاضي
  handle: ""
  # الشعار والنقط اللي بتظهر على صورة الغلاف (python -m fbposter brand)
  tagline: "الذكاء الاصطناعي ببساطة… وبالعامية"
  cover_points: ["برومبتات جاهزة", "نصايح عملية", "شرح مبسط"]

# نوع المحتوى: اسم ملف من مجلد niches/ من غير .yaml
#   tech_ai        → الذكاء الاصطناعي ببساطة (ده اللي ننصح بيه)
#   money          → فلوسك: إدارة مالية شخصية
#   knowledge      → معلومة على الماشي: ثقافة عامة
#   small_business → مشروعك الصغير: تسويق وبيع أونلاين
niche: tech_ai

claude:
  model: claude-opus-5-5
  # low / medium / high: كل ما تعلى بيفكر أكتر وبيكلف أكتر
  effort: medium
  # عدد البوستات في كل طلب واحد لـ Claude لما بنملا الطابور
  batch_size: 7

posting:
  # كام بوست نخليه جاهز في الطابور (28 = أسبوع لو بننزل 4 مرات في اليوم)
  queue_target: 28
  # لو true: مفيش بوست هيتنشر غير لما تكتبوا "approved": true في ملفه
  require_approval: false
  # لو الطابور فاضي وقت النشر: نكتب بوست جديد على طول بـ Claude؟
  auto_generate_when_queue_empty: true
  # نسبة البوستات اللي بتنزل معاها صورة كارت (من 0 لـ 1).
  # كل نوع محتوى ممكن يغيّرها من ملف الـ niche بتاعه
  image_ratio: 0.7

facebook:
  graph_api_version: v26.0

# ألوان الصور
brand:
  background: "#0B1220"
  background_2: "#1E293B"
  accent: "#F59E0B"
  text: "#F8FAFC"
  muted: "#94A3B8"
